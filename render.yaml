services:
  - type: web
    name: farmorai
    env: python
    region: oregon
    plan: free
    buildCommand: python -m pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: gunicorn main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: MODEL_DIR
        value: models
